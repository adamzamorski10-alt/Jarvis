name: Core Tests

on:
  push:
    branches:
      - main
      - "stage-*/*"
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/pyproject.toml

      - name: Install core with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run core test suite
        run: python -m pytest -q
