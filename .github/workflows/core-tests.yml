name: Core Tests

on:
  push:
    branches:
      - main
      - "stage-*/*"
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/pyproject.toml

      - name: Install core with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run core test suite
        run: python -m pytest -q --junitxml=junit/test-results.xml

      - name: Upload pytest results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-pytest-results
          path: services/core/junit/test-results.xml
          if-no-files-found: ignore
